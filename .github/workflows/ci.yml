name: ci

"on":
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_CLIENT_TESTS: "true"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras --dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check scripts tests/contracts tests/custom tests/conftest.py tests/test_release_verification.py

  test_client:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras --dev
      - name: Test serialization, public contracts, and release verification without live API calls
        run: uv run --frozen pytest -q

  test_platforms:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-22.04", "macos-15", "windows-2022"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-extras --dev
      - run: uv run --frozen pytest -q

  build_package:
    needs: [test_client, test_platforms]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - name: Verify the built wheel from a fresh environment
        env:
          PYTHONPATH: ""
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/soferai-wheel"
          uv pip install --python "$RUNNER_TEMP/soferai-wheel/bin/python" dist/*.whl pytest==8.3.4 pytest-asyncio==0.24.0
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/soferai-wheel/bin/python" -m pytest -c /dev/null --import-mode=importlib "$GITHUB_WORKSPACE/tests/contracts" -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-distributions
          path: dist/
          if-no-files-found: error
