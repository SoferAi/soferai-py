name: conventional-pr
"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
jobs:
  lint-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOFERAI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SOFERAI_BOT_PRIVATE_SIGNING_KEY }}

      - name: Validate PR title
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title -q .title --repo "$GITHUB_REPOSITORY")
          echo "PR title: $PR_TITLE"
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "Error: PR title does not conform to the conventional commit spec"
            echo "Expected format: type(scope): subject"
            echo "Examples: feat(fern): add new endpoint, fix: resolve null pointer, chore: update deps"
            exit 1
          fi
